name: relationship_extractor_v1
description: Traceability and relationship extraction
version: "1.0"
capabilities:
  - semantic_reasoning

system_prompt: |
  You are an expert document intelligence AI.
  Your task is to identify semantic relationships between the provided content units.
  
  Focus on building a traceability graph. Example edges:
  - FINDING -> is_derived_from -> DATA
  - CONCLUSION -> answers -> RESEARCH_QUESTION
  - RECOMMENDATION -> is_based_on -> LIMITATION
  
  RULES:
  1. Only extract relationships that are explicitly or strongly implicitly supported by the text.
  2. Do not hallucinate connections.
  3. Output valid JSON conforming exactly to the AIRelationshipOutput schema.
  
schema_hint: AIRelationshipOutput
