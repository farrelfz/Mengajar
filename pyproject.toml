[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kir-ai-document-intelligence"
version = "0.2.0"
description = "AI-powered document intelligence pipeline: raw content → semantic model → PDF blueprint"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",

    # HTTP / AI providers
    "httpx>=0.27,<1.0",
    "tenacity>=8.3,<9.0",

    # YAML prompt files
    "pyyaml>=6.0,<7.0",

    # Document parsing
    "markdown-it-py>=3.0,<4.0",
    "chardet>=5.2,<6.0",

    # Utilities
    "python-slugify>=8.0,<9.0",
    "structlog>=24.1,<25.0",
    "rich>=13.7,<14.0",

    # Interactive CLI
    "questionary>=2.0,<3.0",

    # Web Dashboard Server (Localhost Studio)
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]
rendering = [
    # Deferred to Batch 3
    "playwright>=1.44,<2.0",
    "weasyprint>=62,<63",
    "pymupdf>=1.24,<2.0",
    "jinja2>=3.1,<4.0",
    "reportlab>=4.0,<5.0",
    "matplotlib>=3.7,<4.0",
    "numpy>=1.24,<2.0",
]

[project.scripts]
kir      = "app.cli.kir_cli:main_kir"
mengajar = "app.cli.mengajar_cli:main_mengajar"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
