<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production Intelligence</title><style>body{font:15px system-ui;margin:2rem;background:#101827;color:#e5edf8}main{max-width:1100px;margin:auto}h1{color:#8dd5ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card{background:#182338;border:1px solid #2a3a57;border-radius:10px;padding:1rem}button{background:#277bb5;color:white;border:0;border-radius:5px;padding:.5rem}small{color:#a8b5c8}.status{font-weight:700}a{color:#8dd5ff}</style></head><body><main><h1>Production Intelligence</h1><p>Read-only operational cockpit. Quality, export, repair, benchmark, and review decisions remain with their canonical authorities.</p><button onclick="load()">Refresh jobs</button><section id="jobs" class="grid"></section><script>async function load(){let r=await fetch('/api/intelligence/jobs'),x=await r.json(),e=document.querySelector('#jobs');e.innerHTML='';for(const s of x.jobs){let q=s.quality||{},a=s.artifacts||{}, id=s.identity.job_id;e.innerHTML+=`<article class=card><div class=status>${s.state.current_state}</div><h2>${id}</h2><small>${s.metadata.title||'Untitled'} · snapshot ${s.snapshot_number}</small><p>Quality: ${q.overall_quality_score??'not observed'} · Decision: ${q.decision??'not observed'}</p><p>Blockers: ${(q.hard_blockers||[]).join(', ')||'none observed'}</p><a href="/api/intelligence/jobs/${encodeURIComponent(id)}">Forensic record (JSON)</a> · <a href="/api/intelligence/jobs/${encodeURIComponent(id)}/timeline">Timeline</a> · <a href="/api/intelligence/jobs/${encodeURIComponent(id)}/quality">Quality</a> · <a href="/api/intelligence/jobs/${encodeURIComponent(id)}/repair">Repair</a> · <a href="/api/intelligence/jobs/${encodeURIComponent(id)}/convergence">Convergence</a> · <a href="/api/intelligence/jobs/${encodeURIComponent(id)}/benchmark">Benchmark</a> · <a href="/api/intelligence/jobs/${encodeURIComponent(id)}/review">Review</a> · <a href="/api/intelligence/jobs/${encodeURIComponent(id)}/artifacts">Artifacts</a></article>`}if(!x.jobs.length)e.innerHTML='<p>No persisted job projections yet.</p>'}load()</script></main></body></html>
